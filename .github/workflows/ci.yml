name: CI

on:
  push:
    branches:
      - version-15

  pull_request:
    branches:
      - version-15

concurrency:
  group: api-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe_branch: version-15
            python_version: '3.10'
            node_version: '20'
    name: Server / Frappe ${{ matrix.frappe_branch }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" . > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          check-latest: true

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ matrix.python_version }}-frappe-${{ matrix.frappe_branch }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python_version }}-frappe-${{ matrix.frappe_branch }}-pip-
            ${{ runner.os }}-python-${{ matrix.python_version }}-pip-
            ${{ runner.os }}-pip-

      - name: Get Yarn cache directory
        id: yarn-cache-dir-path
        run: |
          echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-node-${{ matrix.node_version }}-frappe-${{ matrix.frappe_branch }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node_version }}-frappe-${{ matrix.frappe_branch }}-yarn-
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install Bench
        run: |
          python -m pip install --upgrade pip
          python -m pip install frappe-bench

      - name: Setup Bench
        run: |
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            --version "${{ matrix.frappe_branch }}" \
            ~/frappe-bench

      - name: Install App
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench get-app api "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: Create Site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test_site \
            --db-root-password root \
            --admin-password admin \
            --mariadb-user-host-login-scope='%'

      - name: Install App to Site
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site install-app api

      - name: Build Assets
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench build

      - name: Enable Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        env:
          TYPE: server
          CI: 'Yes'
        run: |
          bench --site test_site run-tests --app api
